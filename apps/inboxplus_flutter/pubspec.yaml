name: inboxplus_flutter
description: Standalone, device-local universal messaging inbox.
publish_to: none
version: 0.9.0+112

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  inboxplus_storage:
    path: ../../packages/inboxplus_storage
  crypto: 3.0.8
  ffi: 2.2.0
  file_picker: 13.3.2
  flutter_secure_storage: 11.2.0
  media_kit: 1.2.6
  media_kit_libs_video: 1.0.7
  media_kit_video: 2.0.1
  path: 1.9.1
  path_provider: 2.1.6
  qr_flutter: 4.1.0
  unorm_dart: 0.3.3
  url_launcher: 6.3.3
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/third_party_notices.txt
    - assets/inboxplus-logo.png
    - assets/reaction_emoji.json

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
