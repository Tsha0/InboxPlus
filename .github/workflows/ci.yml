name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the macOS Messages adapter
        run: swift test --package-path native/imessage
      - name: Verify packaging, media artifacts and dependency inventory
        run: python3 -m unittest discover -s Tests/Packaging -v
      - name: Check whitespace
        run: git diff --check

  generated-files:
    name: Generated files are current
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate the brand marks
        run: python3 Scripts/generate-flutter-glyphs.py
      - name: Regenerate the app icon
        run: swift Scripts/make-icon.swift docs/assets/inboxplus-logo.png Resources/AppIcon.icns
      - name: Regenerate the bill of materials
        run: python3 Scripts/generate-sbom.py
      - name: Fail if anything drifted
        run: git diff --exit-code
