name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      android_build:
        description: Run the deferred Android build check
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GH_TOKEN: ${{ github.token }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base: ${{ steps.changes.outputs.base }}
      head: ${{ steps.changes.outputs.head }}
      code: ${{ steps.changes.outputs.code }}
      macos: ${{ steps.changes.outputs.macos }}
      linux: ${{ steps.changes.outputs.linux }}
      windows: ${{ steps.changes.outputs.windows }}
      ios: ${{ steps.changes.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Identify changed inputs
        id: changes
        run: python3 Scripts/ci-changes.py

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check whitespace in committed changes
        env:
          BASE: ${{ needs.changes.outputs.base }}
          HEAD: ${{ needs.changes.outputs.head }}
        run: |
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            git diff --check "$BASE" "$HEAD"
          else
            git show --format= --check "$HEAD"
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: needs.changes.outputs.code == 'true'
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Verify formatting and storage analysis
        if: needs.changes.outputs.code == 'true'
        working-directory: packages/inboxplus_storage
        run: |
          dart pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          dart analyze
      - name: Verify formatting and application analysis
        if: needs.changes.outputs.code == 'true'
        working-directory: apps/inboxplus_flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze

  generated-files:
    name: Generated files / Linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve locked dependencies
        run: |
          (cd packages/inboxplus_storage && dart pub get --enforce-lockfile)
          (cd apps/inboxplus_flutter && flutter pub get --enforce-lockfile)
      - name: Verify generated assets and inventory
        run: |
          python3 -m pip install Pillow==10.4.0
          python3 Scripts/generate-platform-icons.py --check
          python3 Scripts/generate-flutter-glyphs.py --check
          python3 Scripts/generate-sbom.py
          go -C native/connectors mod download
          python3 Scripts/generate-third-party-notices.py
      - name: Verify generated Drift source
        working-directory: packages/inboxplus_storage
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Fail if generated files drifted
        run: git diff --exit-code

  generated-macos:
    name: Generated files / macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          swift Scripts/make-icon.swift docs/assets/inboxplus-logo.png Resources/AppIcon.icns
          git diff --exit-code -- Resources/AppIcon.icns

  messages:
    name: Messages adapter
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          swift test --package-path native/imessage

  updater:
    name: Updater
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare verified updater artifact
        run: python3 Scripts/verify-media-artifacts.py --platform sparkle --cache-dir "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
      - run: |
          swift test --package-path native/updates --force-resolved-versions

  packaging-linux:
    name: Packaging checks / Linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s Tests/Packaging -v

  packaging-windows:
    name: Packaging checks / Windows
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s Tests/Packaging -p test_flutter_desktop.py -v

  packaging-macos:
    name: Packaging checks / macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s Tests/Packaging -p test_icons.py -v

  macos:
    name: Platform tests and builds / macOS
    needs: [changes, lint, generated-files, packaging-linux, messages, updater, generated-macos, packaging-macos]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.macos == 'true' &&
      needs.lint.result == 'success' &&
      needs.generated-files.result == 'success' &&
      needs.packaging-linux.result == 'success' &&
      needs.messages.result == 'success' &&
      needs.updater.result == 'success' &&
      needs.generated-macos.result == 'success' &&
      needs.packaging-macos.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: Identify Go cache toolchain and paths
        id: go-cache
        run: |
          echo "INBOXPLUS_CONNECTORS_BUILD_CACHE=$RUNNER_TEMP/inboxplus-connectors" >> "$GITHUB_ENV"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          toolchain="$( { go version; xcodebuild -version; xcrun --sdk macosx --show-sdk-build-version; clang --version; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - name: Cache verified Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.go-cache.outputs.modules }}
          key: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/connectors/go.sum') }}
      - name: Cache Go compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.toolchain }}-${{ hashFiles('native/connectors/**/*.go', 'native/connectors/**/*.c', 'native/connectors/**/*.h', 'native/connectors/go.mod', 'native/connectors/go.sum', 'native/connectors/build.sh', 'Scripts/build-connectors-cache.py') }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.toolchain }}-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify connector modules and behavior
        working-directory: native/connectors
        env:
          CGO_ENABLED: '1'
          GOFLAGS: -mod=readonly
        run: |
          go mod verify
          time go test ./...
          time bash build.sh host
          case "$RUNNER_OS" in
            macOS) library="$(pwd)/build/libinboxplus_connectors.dylib" ;;
            Linux) library="$(pwd)/build/libinboxplus_connectors.so" ;;
            Windows) library="$(cygpath -w "$(pwd)/build/inboxplus_connectors.dll")" ;;
          esac
          echo "INBOXPLUS_CONNECTORS_LIBRARY=$library" >> "$GITHUB_ENV"
      - name: Verify encrypted storage
        working-directory: packages/inboxplus_storage
        run: |
          dart pub get --enforce-lockfile
          python3 ../../Scripts/retry-sqlite-download.py dart test
      - name: Verify Flutter application
        working-directory: apps/inboxplus_flutter
        run: |
          flutter pub get --enforce-lockfile
          python3 ../../Scripts/retry-sqlite-download.py flutter test
      - name: Build native desktop application
        working-directory: apps/inboxplus_flutter
        run: |
          python3 ../../Scripts/verify-media-artifacts.py --platform sparkle --cache-dir "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          python3 ../../Scripts/time-macos-build.py
      - name: Upload macOS build timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-build-timings
          path: ${{ runner.temp }}/macos-build-timings.json
          if-no-files-found: ignore
      - name: Package desktop development build
        run: python3 Scripts/package-flutter-desktop.py --target macos
      - name: Upload desktop development archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: InboxPlus-macos-development
          path: |
            build/flutter-desktop/*.zip
            build/flutter-desktop/*.tar.gz
            build/flutter-desktop/*.sha256
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Platform tests and builds / Windows
    needs: [changes, lint, generated-files, packaging-linux, packaging-windows]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.windows == 'true' &&
      needs.lint.result == 'success' &&
      needs.generated-files.result == 'success' &&
      needs.packaging-linux.result == 'success' &&
      needs.packaging-windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/connectors/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Locate Windows Cgo compiler
        shell: pwsh
        run: |
          $compiler = @('C:\mingw64\bin', 'C:\msys64\mingw64\bin') | Where-Object { Test-Path "$_\gcc.exe" } | Select-Object -First 1
          if (-not $compiler) { throw 'The Windows runner needs a MinGW GCC compiler for Go/cgo.' }
          $compiler | Out-File -FilePath $env:GITHUB_PATH -Append
          'CC=gcc' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify connector modules and behavior
        working-directory: native/connectors
        env:
          CGO_ENABLED: '1'
          GOFLAGS: -mod=readonly
        run: |
          go mod verify
          time go test ./...
          time bash build.sh host
          case "$RUNNER_OS" in
            macOS) library="$(pwd)/build/libinboxplus_connectors.dylib" ;;
            Linux) library="$(pwd)/build/libinboxplus_connectors.so" ;;
            Windows) library="$(cygpath -w "$(pwd)/build/inboxplus_connectors.dll")" ;;
          esac
          echo "INBOXPLUS_CONNECTORS_LIBRARY=$library" >> "$GITHUB_ENV"
      - name: Verify encrypted storage
        working-directory: packages/inboxplus_storage
        run: |
          dart pub get --enforce-lockfile
          python3 ../../Scripts/retry-sqlite-download.py dart test
      - name: Verify Flutter application
        working-directory: apps/inboxplus_flutter
        run: |
          flutter pub get --enforce-lockfile
          python3 ../../Scripts/retry-sqlite-download.py flutter test
      - name: Build native desktop application
        working-directory: apps/inboxplus_flutter
        run: time flutter build windows --release
      - name: Package desktop development build
        run: python3 Scripts/package-flutter-desktop.py --target windows
      - name: Upload desktop development archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: InboxPlus-windows-development
          path: |
            build/flutter-desktop/*.zip
            build/flutter-desktop/*.tar.gz
            build/flutter-desktop/*.sha256
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Platform tests and builds / Linux
    needs: [changes, lint, generated-files, packaging-linux]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.linux == 'true' &&
      needs.lint.result == 'success' &&
      needs.generated-files.result == 'success' &&
      needs.packaging-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/connectors/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libmpv-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: Verify connector modules and behavior
        working-directory: native/connectors
        env:
          CGO_ENABLED: '1'
          GOFLAGS: -mod=readonly
        run: |
          go mod verify
          time go test ./...
          time bash build.sh host
          case "$RUNNER_OS" in
            macOS) library="$(pwd)/build/libinboxplus_connectors.dylib" ;;
            Linux) library="$(pwd)/build/libinboxplus_connectors.so" ;;
            Windows) library="$(cygpath -w "$(pwd)/build/inboxplus_connectors.dll")" ;;
          esac
          echo "INBOXPLUS_CONNECTORS_LIBRARY=$library" >> "$GITHUB_ENV"
      - name: Verify encrypted storage
        working-directory: packages/inboxplus_storage
        run: |
          dart pub get --enforce-lockfile
          python3 ../../Scripts/retry-sqlite-download.py dart test
      - name: Verify Flutter application
        working-directory: apps/inboxplus_flutter
        run: |
          flutter pub get --enforce-lockfile
          python3 ../../Scripts/retry-sqlite-download.py flutter test
      - name: Build native desktop application
        working-directory: apps/inboxplus_flutter
        run: time flutter build linux --release
      - name: Package desktop development build
        run: python3 Scripts/package-flutter-desktop.py --target linux
      - name: Upload desktop development archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: InboxPlus-linux-development
          path: |
            build/flutter-desktop/*.zip
            build/flutter-desktop/*.tar.gz
            build/flutter-desktop/*.sha256
          if-no-files-found: error
          compression-level: 0

  android:
    name: Platform tests and builds / Android
    needs: [changes, lint, generated-files, packaging-linux]
    if: >-
      ${{ !cancelled() && needs.lint.result == 'success' &&
          needs.generated-files.result == 'success' && needs.packaging-linux.result == 'success' &&
          github.event_name == 'workflow_dispatch' && inputs.android_build }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/connectors/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Resolve locked dependencies
        working-directory: apps/inboxplus_flutter
        run: flutter pub get --enforce-lockfile
      - name: Build Android application
        working-directory: apps/inboxplus_flutter
        run: flutter build apk --release

  ios:
    name: Platform tests and builds / iOS
    needs: [changes, lint, generated-files, packaging-linux]
    if: >-
      ${{ !cancelled() &&
      needs.lint.result == 'success' &&
      needs.generated-files.result == 'success' &&
      needs.packaging-linux.result == 'success' &&
      needs.changes.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/connectors/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record the Xcode version
        run: xcodebuild -version
      - name: Resolve locked dependencies
        working-directory: apps/inboxplus_flutter
        run: flutter pub get --enforce-lockfile
      # Archiving is what strips symbols for the App Store, so build the archive
      # TestFlight would receive rather than a plain device build.
      - name: Build unsigned App Store archive
        working-directory: apps/inboxplus_flutter
        run: flutter build ipa --release --no-codesign
      - name: Verify the archived application
        run: python3 Scripts/verify-ios-app.py apps/inboxplus_flutter/build/ios/archive/Runner.xcarchive

  passed:
    name: CI passed
    needs: [changes, lint, generated-files, generated-macos, messages, updater, packaging-linux, packaging-windows, packaging-macos, macos, windows, linux, ios, android]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require selected jobs and intentional skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          ANDROID_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.android_build }}
        run: python3 Scripts/check-ci-results.py
