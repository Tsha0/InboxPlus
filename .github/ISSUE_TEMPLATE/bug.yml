name: Bug
description: Something in Inbox+ for Mac does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inbox and conversations
        - Sending and attachments
        - Notifications
        - Adding an account or network
        - iMessage
        - Contacts and linked people
        - App updates
        - Startup and the local runtime
        - Something else
  - type: input
    id: version
    attributes:
      label: Version
      description: Inbox+ → About Inbox+, or the commit you built from.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Optional. Output of `InboxPlusRuntimeCLI diagnostics`, which is redacted. Never paste tokens,
        cookies, passwords or message contents.
      render: text
