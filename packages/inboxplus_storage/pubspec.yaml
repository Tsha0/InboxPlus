name: inboxplus_storage
description: Encrypted, device-local application storage for Inbox+.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  drift: 2.35.3
  sqlite3: 3.8.0

dev_dependencies:
  build_runner: 2.17.1
  drift_dev: 2.35.2
  test: 1.33.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
