<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @font-face { font-family: Bricolage; src: url("fonts/bricolage-grotesque-latin.woff2") format("woff2"); font-weight: 400 800; }
      @font-face { font-family: DM; src: url("fonts/dm-sans-latin.woff2") format("woff2"); font-weight: 400 700; }
    </style>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r=".8" fill="#f3f3f3" opacity=".16"/></pattern>
    <g id="star"><rect x="44" y="14" width="12" height="72" rx="3"/><rect x="14" y="44" width="72" height="12" rx="3"/><rect x="44" y="14" width="12" height="72" rx="3" transform="rotate(45 50 50)"/><rect x="44" y="14" width="12" height="72" rx="3" transform="rotate(-45 50 50)"/></g>
  </defs>
  <rect width="1200" height="630" fill="#181818"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <g fill="#f3f3f3" transform="translate(32 25) scale(.45)"><use href="#star"/></g>
  <text x="86" y="57" fill="#f3f3f3" font-family="DM, sans-serif" font-size="19" font-weight="500">inboxplus.chat</text>
  <g transform="translate(183 118) rotate(-9)"><rect width="150" height="47" rx="17" fill="#dddddd"/><text x="75" y="30" text-anchor="middle" fill="#333333" font-family="DM, sans-serif" font-size="19">hey you! ✳</text></g>
  <g transform="translate(871 452) rotate(-6)"><rect width="167" height="48" rx="17" fill="#bcbcbc"/><text x="83" y="31" text-anchor="middle" fill="#242424" font-family="DM, sans-serif" font-size="18">on my way ↗</text></g>
  <text x="48" y="366" fill="#f3f3f3" font-family="Bricolage, sans-serif" font-size="220" font-weight="700" letter-spacing="-12" style="font-variation-settings: 'opsz' 48">Inbox<tspan font-weight="500" dx="8">+</tspan></text>
  <g fill="#f3f3f3" font-family="Bricolage, sans-serif" font-size="51" font-weight="500" letter-spacing="-2.7"><text x="737" y="279">Your people.</text><text x="737" y="330">All together<tspan fill="#888888">.</tspan></text></g>
  <text x="60" y="412" fill="#f3f3f3" font-family="DM, sans-serif" font-size="11" letter-spacing="1.4">A LITTLE LESS APP HOPPING.</text>
  <text x="740" y="376" fill="#f3f3f3" font-family="DM, sans-serif" font-size="17">One happy little Mac app.</text>
  <g fill="#777777" transform="translate(621 116) rotate(15) scale(.5)"><use href="#star"/></g>
  <g transform="translate(328 472) rotate(8)"><rect width="132" height="45" rx="16" fill="#eeeeee"/><text x="66" y="29" text-anchor="middle" fill="#242424" font-family="DM, sans-serif" font-size="18">coffee? ☕</text></g>
  <text x="40" y="595" fill="#f3f3f3" font-family="DM, sans-serif" font-size="12">Good company. Fewer windows.</text>
  <text x="1160" y="595" text-anchor="end" fill="#f3f3f3" font-family="DM, sans-serif" font-size="12">Local-first. Made for Mac.</text>
</svg>
